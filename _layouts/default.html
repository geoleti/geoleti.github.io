<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }} · GeoLeti">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <title>{% if page.title and page.title != 'Inicio' %}{{ page.title | escape }} · {% endif %}GeoLeti — Geografía, datos y territorio</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="GeoLeti, inicio">
        <span class="brand-symbol" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>geo<span class="brand-accent">leti</span><span class="brand-dot">.</span></span>
      </a>
      <button class="menu-button" id="menu-button" aria-expanded="false" aria-controls="site-nav" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Navegación principal">
        <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Inicio</a>
        <a {% if page.url contains '/proyectos/' %}aria-current="page"{% endif %} href="{{ '/proyectos/' | relative_url }}">Proyectos</a>
        <a {% if page.url contains '/sobre-mi/' %}aria-current="page"{% endif %} href="{{ '/sobre-mi/' | relative_url }}">Sobre mí</a>
        <a class="nav-external" href="https://github.com/geoleti" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main id="contenido">{{ content }}</main>
  <footer class="site-footer">
    <div class="container footer-top">
      <div>
        <a class="brand footer-brand" href="{{ '/' | relative_url }}">geo<span class="brand-accent">leti</span><span class="brand-dot">.</span></a>
        <p>Geografía · Datos · Territorio</p>
      </div>
      <div class="footer-links">
        <a href="{{ '/proyectos/' | relative_url }}">Proyectos</a>
        <a href="{{ '/sobre-mi/' | relative_url }}">Sobre mí</a>
        <a href="https://github.com/geoleti" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </div>
    <div class="container footer-bottom"><span>© <span id="copyright-year">2026</span> · GeoLeti</span><span>Hecho con Jekyll y GitHub Pages.</span></div>
  </footer>
</body>
</html>
